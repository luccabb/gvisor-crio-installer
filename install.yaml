# gVisor (runsc) on cri-o — RuntimeClass + installer DaemonSet.
# ⚠️  cri-o 1.35.x + amd64 nodes ONLY: the installer swaps in a patched crio 1.35.4 (wrong on other versions).
#     The gvisor-crio-install=true node label is the safety gate — label only matching nodes:
#       kubectl label node <node> gvisor-crio-install=true
# Experimental (unmerged gVisor #13279 + cri-o #9974). Docs: https://github.com/luccabb/gvisor-crio-installer
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-crio-installer
  namespace: kube-system
  labels:
    app: gvisor-crio-installer
spec:
  selector:
    matchLabels:
      app: gvisor-crio-installer
  template:
    metadata:
      labels:
        app: gvisor-crio-installer
    spec:
      # Opt-in gate: only nodes you label gvisor-crio-install=true (must be cri-o 1.35.x + amd64).
      nodeSelector:
        gvisor-crio-install: "true"
      tolerations:
        - operator: Exists
      hostPID: true
      initContainers:
        - name: install
          image: ghcr.io/luccabb/gvisor-crio-installer:1.35.4-amd64
          securityContext:
            privileged: true
          command: ["/opt/gvisor-install/install.sh"]
          volumeMounts:
            - name: host-root
              mountPath: /host
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
      volumes:
        - name: host-root
          hostPath:
            path: /
