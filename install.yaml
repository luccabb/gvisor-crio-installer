# gVisor on cri-o (OKE / OCI) — RuntimeClass + installer DaemonSet
# =============================================================================
# Enables the gVisor (runsc) sandbox runtime on cri-o nodes.
#
#   ⚠️  REQUIREMENTS — READ FIRST:
#   • cri-o 1.35.x  AND  amd64/x86_64 nodes ONLY. The installer swaps in a
#     patched `crio 1.35.4` binary; on any other cri-o version it would replace
#     your crio with the wrong version. The node label below is your safety gate.
#   • Built from two UNMERGED upstream PRs (experimental):
#       gVisor  https://github.com/google/gvisor/pull/13279
#       cri-o   https://github.com/cri-o/cri-o/pull/9974  (backported to release-1.35)
#   • The DaemonSet does a LIVE crio binary swap + restart on each labeled node
#     (original saved to /usr/bin/crio.orig). Idempotent; re-runs on boot.
#
#   USAGE:
#     1. Label only the cri-o 1.35.x / amd64 nodes you want gVisor on:
#          kubectl label node <node> gvisor-crio-install=true
#     2. kubectl apply -f <this-url>
#     3. Test:  a pod with  runtimeClassName: gvisor  →  `uname -r` = 4.19.0-gvisor
#
#   Installer image: ghcr.io/luccabb/gvisor-crio-installer:1.35.4-amd64 (public)
#   Why cri-o needs this (containerd doesn't): https://github.com/google/gvisor/issues/10313
# =============================================================================
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gvisor-crio-installer
  namespace: kube-system
  labels:
    app: gvisor-crio-installer
spec:
  selector:
    matchLabels:
      app: gvisor-crio-installer
  template:
    metadata:
      labels:
        app: gvisor-crio-installer
    spec:
      # Opt-in gate: only nodes you label gvisor-crio-install=true (must be cri-o 1.35.x + amd64).
      nodeSelector:
        gvisor-crio-install: "true"
      tolerations:
        - operator: Exists
      hostPID: true
      initContainers:
        - name: install
          image: ghcr.io/luccabb/gvisor-crio-installer:1.35.4-amd64
          securityContext:
            privileged: true
          command: ["/opt/gvisor-install/install.sh"]
          volumeMounts:
            - name: host-root
              mountPath: /host
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
      volumes:
        - name: host-root
          hostPath:
            path: /
